<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Enterseed Platform</title>
  <script>
    // GitHub Pages SPA router redirect
    // Captures path and redirects to root index.html with appropriate hash/query
    var pathSegmentsToKeep = 1; // 1 segment for repository name (/EnterSeed/)
    var l = window.location;
    var path = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
    var target = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/';
    if (path) {
      target += '#' + path;
    }
    window.location.replace(target);
  </script>
</head>
<body style="font-family: sans-serif; background: #FFF7F1; color: #2B1C33; padding: 2rem; text-align: center;">
  <h2>Redirecting to Enterseed Platform…</h2>
</body>
</html>
